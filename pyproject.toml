[build-system]
# setuptools >= 77 is required, not merely preferred: the PEP 639 fields below
# (`license = "MIT"` as an SPDX expression, plus `license-files`) are only
# understood from that version. Older setuptools either fails the build or
# silently emits the deprecated `License:` field instead of
# `License-Expression:`, so a user building from the sdist would get metadata
# that does not match what we publish.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpugem"
version = "0.1.0"
description = "GPU-accelerated Flux Balance Analysis for genome-scale metabolic models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Digital Metabolic Twin Centre" },
]
keywords = [
    "flux balance analysis", "FBA", "metabolic modelling",
    "GPU", "PDLP", "cuOpt", "COBRA", "systems biology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

# cuOpt is deliberately NOT a hard dependency, for two reasons.
#
# 1. It is a very large, GPU-only install. The 'cuopt-cu12' entry on PyPI is a
#    wheel_stub that transparently resolves the real wheels from NVIDIA's index
#    at install time, so
#        pip install "cuopt-cu12>=26.6.0"
#    does work on an unrestricted network (verified: it resolves
#    cuopt-cu12 26.8.0). What it pulls in is ~1.4 GB, dominated by
#    libcudf-cu12 (716 MB) and libcuopt-cu12 (592 MB), and none of it is
#    usable without an NVIDIA GPU. Making that a hard dependency would impose
#    a 1.4 GB GPU-only download on everyone, including users who only want to
#    inspect or build a model, or who are reviewing the code on a laptop.
#
#    Behind a proxy or firewall that does not allow pypi.nvidia.com, the stub
#    fails with a confusing build error rather than a clean "not found". Naming
#    the index explicitly is the more robust form and skips the stub entirely:
#        pip install gpugem[gpu] --extra-index-url https://pypi.nvidia.com
# 2. gpugem/__init__.py already defers the cuOpt check until a solve is actually
#    requested, and gpugem/_deps.py raises a DependencyError naming the remedy.
#    The packaging now matches that design.
[project.optional-dependencies]
gpu         = ["cuopt-cu12>=26.6.0"]
gurobi      = ["gurobipy>=11"]
application = ["pandas>=2.0", "gurobipy>=11"]
cobra       = ["cobra>=0.29"]
# pandas and matplotlib are here because tests/ imports benchmarks.* (tables, figures); without
# them a clean `pip install -e ".[dev]"` cannot even collect the suite.
dev         = ["pytest>=7", "pytest-cov", "ruff", "pandas>=2.0", "matplotlib"]

[project.urls]
Homepage   = "https://github.com/Digital-Metabolic-Twin-Centre/gpuGEM"
Repository = "https://github.com/Digital-Metabolic-Twin-Centre/gpuGEM"
Issues     = "https://github.com/Digital-Metabolic-Twin-Centre/gpuGEM/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpugem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test suite imports `benchmarks.*`, which is a repository directory rather
# than an installed package (it is development/figure code, deliberately not
# shipped in the wheel). Without this, a fresh clone fails to COLLECT 12 of the
# 17 test files with "No module named 'benchmarks'", even though nothing is
# actually wrong with the installation.
pythonpath = ["."]

[tool.ruff]
line-length = 100
