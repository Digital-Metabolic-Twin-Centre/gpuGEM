[build-system]
# setuptools >= 77 is required, not merely preferred: the PEP 639 fields below
# (`license = "MIT"` as an SPDX expression, plus `license-files`) are only
# understood from that version. Older setuptools either fails the build or
# silently emits the deprecated `License:` field instead of
# `License-Expression:`, so a user building from the sdist would get metadata
# that does not match what we publish.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpugem"
version = "0.1.0"
description = "GPU-accelerated Flux Balance Analysis for genome-scale metabolic models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Digital Metabolic Twin Centre" },
]
keywords = [
    "flux balance analysis", "FBA", "metabolic modelling",
    "GPU", "PDLP", "cuOpt", "COBRA", "systems biology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    # gpuGEM is a GPU solver: `pip install gpugem` is the full, working tool, so cuOpt and
    # COBRApy are required rather than optional. cuOpt is a large download (~1.4 GB, mostly
    # libcudf-cu12 and libcuopt-cu12) and needs an NVIDIA GPU with CUDA 12 to solve. The
    # 'cuopt-cu12' entry on PyPI is a stub that fetches the real wheels from NVIDIA's index.
    # `import gpugem` itself still works without a usable GPU; only `solve` needs one.
    "cuopt-cu12>=26.6.0",
    "cobra>=0.29",
]

[project.optional-dependencies]
gurobi      = ["gurobipy>=11"]
application = ["pandas>=2.0", "gurobipy>=11"]
# pandas and matplotlib are here because tests/ imports benchmarks.* (tables, figures); without
# them a clean `pip install -e ".[dev]"` cannot even collect the suite.
dev         = ["pytest>=7", "pytest-cov", "ruff", "pandas>=2.0", "matplotlib"]

[project.urls]
Homepage   = "https://github.com/Digital-Metabolic-Twin-Centre/gpuGEM"
Repository = "https://github.com/Digital-Metabolic-Twin-Centre/gpuGEM"
Issues     = "https://github.com/Digital-Metabolic-Twin-Centre/gpuGEM/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpugem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test suite imports `benchmarks.*`, which is a repository directory rather
# than an installed package (it is development/figure code, deliberately not
# shipped in the wheel). Without this, a fresh clone fails to COLLECT 12 of the
# 17 test files with "No module named 'benchmarks'", even though nothing is
# actually wrong with the installation.
pythonpath = ["."]

[tool.ruff]
line-length = 100
