name: Publish to PyPI

# Runs when a GitHub release is PUBLISHED (the same click that makes Zenodo archive it).
# It checks that the tag matches every version string in the repository, runs the test
# suite, builds the distribution, and then WAITS for a human to approve the upload.
#
# Uploading uses PyPI Trusted Publishing: PyPI trusts this workflow by identity
# (repository + workflow file + environment), so there is no API token anywhere.
#
# One-time setup (see RELEASE.md, "Automated publishing"):
#   1. PyPI: project gpugem -> Settings -> Publishing -> add a GitHub trusted publisher
#      (owner Digital-Metabolic-Twin-Centre, repo gpuGEM, workflow publish.yml,
#      environment pypi).
#   2. GitHub: Settings -> Environments -> New environment "pypi" -> Required reviewers.
#
# A version can be uploaded to PyPI only once, ever. Bump the version in pyproject.toml,
# gpugem/__init__.py, CITATION.cff and .zenodo.json BEFORE creating the release.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    # Draft and pre-releases never publish to PyPI.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        # for a release event this checks out the tagged commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Tag must match every version string
        run: python .github/scripts/check_release_version.py "${{ github.event.release.tag_name }}"

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[dev]"

      # Same checks as CI. The runners have no GPU, so GPU tests are skipped, not passed.
      - name: Lint (correctness rules)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Test
        run: pytest -q -rs

      - name: Build and check the distribution
        run: |
          python -m build
          twine check dist/*

      - name: Record what would be uploaded
        run: |
          {
            echo "### Files to upload for ${{ github.event.release.tag_name }}"
            echo
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The "pypi" environment is configured with required reviewers: this job pauses here
    # until a reviewer clicks "Approve and deploy" in the Actions tab.
    environment:
      name: pypi
      url: https://pypi.org/project/gpugem/
    permissions:
      id-token: write   # lets PyPI verify this workflow's identity (Trusted Publishing)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
